name: Sync compat worklist

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: compat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync worklist and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync.py

      - name: Commit results
        run: |
          git config user.name "compat-bot"
          git config user.email "compat-bot@users.noreply.github.com"
          git add WORKLIST.md data/worklist.json data/state.json
          git diff --quiet --cached || git commit -m "Nightly sync $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
